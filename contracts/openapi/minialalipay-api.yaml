          maxLength: 255
          description: 已脱敏的分录摘要。
        createdAt:
          type: string
          format: date-time
          description: 分录创建时间。
    LedgerEntryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LedgerEntry'
        nextCursor:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          description: 绑定创建时间与分录 ID 的下一页不透明游标；没有更多数据时为空。
    LedgerEntryPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/LedgerEntryPage'
    CreateTransferDraftRequest:
      type: object
      additionalProperties: false
      required: [payeeUserId, amountFen]
      properties:
        payeeUserId: { type: string, minLength: 1, maxLength: 26, description: 明确选择的收款用户 ID。 }
        amountFen: { type: integer, format: int64, minimum: 1, maximum: 5000000, description: 转账金额，单位分。 }
        remark: { type: [string, 'null'], maxLength: 128, description: 用户可见转账备注。 }
    UpdateTransferDraftRequest:
      type: object
      additionalProperties: false
      required: [version, amountFen]
      properties:
        version: { type: integer, format: int64, minimum: 0, description: 客户端读取到的草稿 CAS 版本。 }
        amountFen: { type: integer, format: int64, minimum: 1, maximum: 5000000, description: 修改后金额，单位分。 }
        remark: { type: [string, 'null'], maxLength: 128 }
    DraftVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
    IssueConfirmationRequest:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId, subjectVersion, paymentProof]
      properties:
        subjectType: { type: string, enum: [TRANSFER_DRAFT] }
        subjectId: { type: string, minLength: 1, maxLength: 26 }
        subjectVersion: { type: integer, format: int64, minimum: 0 }
        paymentProof: { type: string, minLength: 1, maxLength: 256, description: 用户中心签发的一次性短期支付密码证明，不得记录日志。 }
    SubmitTransferRequest:
      type: object
      additionalProperties: false
      required: [draftId, confirmationToken]
      properties:
        draftId: { type: string, minLength: 1, maxLength: 26 }
        confirmationToken: { type: string, minLength: 1, maxLength: 256, description: 两分钟有效的一次性确认令牌，不得进入 URL 或日志。 }
    TransferDraft:
      type: object
      additionalProperties: false
      required: [draftId, payeeUserId, amountFen, remark, status, version, expiresAt]
      properties:
        draftId: { type: string, minLength: 1, maxLength: 26 }
        payeeUserId: { type: string, minLength: 1, maxLength: 26 }
        amountFen: { type: integer, format: int64, minimum: 1, maximum: 5000000 }
        remark: { type: [string, 'null'], maxLength: 128 }
        status: { type: string, enum: [DRAFT, VALIDATED, PENDING_CONFIRMATION, SUBMITTED, EXPIRED] }
        version: { type: integer, format: int64, minimum: 0 }
        expiresAt: { type: string, format: date-time }
    TransferTransaction:
      type: object
      additionalProperties: false
      required: [transactionId, businessType, status, amountFen, payerUserId, payerDisplayName, payeeUserId, payeeDisplayName, remark, statusUrl, createdAt, updatedAt]
      properties:
        transactionId: { type: string, minLength: 1, maxLength: 26 }
        businessType: { type: string, enum: [TRANSFER] }
        status: { type: string, enum: [PROCESSING, COMPENSATING, MANUAL_REVIEW, SUCCESS, REVERSED, CANCELLED] }
        amountFen: { type: integer, format: int64, minimum: 1, maximum: 5000000 }
        payerUserId: { type: string, minLength: 1, maxLength: 26, description: 付款用户 ID。 }
        payerDisplayName: { type: [string, 'null'], maxLength: 64, description: 付款人展示名；用户中心暂不可用时为空。 }
        payeeUserId: { type: string, minLength: 1, maxLength: 26, description: 收款用户 ID。 }
        payeeDisplayName: { type: [string, 'null'], maxLength: 64, description: 收款人展示名；用户中心暂不可用时为空。 }
        remark: { type: [string, 'null'], maxLength: 128, description: 转账受理时来源草稿中的备注。 }
        statusUrl: { type: string, pattern: '^/api/v1/transfers/' }
        createdAt: { type: string, format: date-time, description: 交易受理时间。 }
        updatedAt: { type: string, format: date-time }
    TransferDraftResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties: { data: { $ref: '#/components/schemas/TransferDraft' } }
    TransferValidationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [result, riskLevel, version]
              properties:
                result: { type: string, enum: [PASS, MANUAL] }
                riskLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
                version: { type: integer, format: int64, minimum: 0 }
    ConfirmationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [confirmationToken, subjectHash, expiresAt]
              properties:
                confirmationToken: { type: string, description: 仅本次响应返回的原始确认令牌。 }
                subjectHash: { type: string, pattern: '^sha256:' }
                expiresAt: { type: string, format: date-time }
    TransferTransactionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { $ref: '#/components/schemas/TransferTransaction' } }
    TransferReceiptResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [transactionId, status, amountFen, completedAt]
              properties:
                transactionId: { type: string, minLength: 1, maxLength: 26 }
                status: { type: string, enum: [SUCCESS, REVERSED, CANCELLED] }
                amountFen: { type: integer, format: int64, minimum: 1 }
                completedAt: { type: string, format: date-time }
    Contact:
      type: object
      additionalProperties: false
      required: [payeeUserId, successCount, pinned]
      properties:
        payeeUserId: { type: string, minLength: 1, maxLength: 64 }
        alias: { type: string, maxLength: 64, nullable: true }
        successCount: { type: integer, format: int64, minimum: 0 }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        pinned: { type: boolean }
    UpdateContactRequest:
      type: object
      additionalProperties: false
      properties:
        alias: { type: string, maxLength: 64, nullable: true }
        pinned: { type: boolean, nullable: true }
        hidden: { type: boolean, nullable: true }
    ContactListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Contact' }
  responses:
    BadRequest:
      description: 请求格式或字段不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未认证或会话失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF、角色或对象级权限拒绝
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 幂等、版本、状态或唯一约束冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在或调用方无权感知
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: 请求使用了目标资源不支持的 HTTP 方法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotAcceptable:
      description: 无法生成客户端声明可以接收的响应格式
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: 请求正文使用了接口不支持的媒体类型
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: 订单、请求或事件游标已经过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: 可理解的业务规则拒绝
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 请求超过频率或安全尝试限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 未分类内部错误，不返回内部细节
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: TCC、模型或关键依赖暂不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ScenarioOutcomeUnknown:
      description: 资金受理或执行结果暂未知；响应 data 必须携带真实业务订单编号和可查询状态，客户端不得展示成功。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ScenarioPayment'
    ScenarioReviewRequired:
      description: 前置风控命中人工复核，订单已进入 RISK_REVIEW 并创建预检工单；客户端不得签发或展示确认令牌，应引导用户等待运营审核。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
  - bearerAuth: []
  - cookieAuth: []
