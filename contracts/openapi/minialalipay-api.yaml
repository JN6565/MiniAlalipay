openapi: 3.1.0
info:
  title: MiniAlalipay API
  version: 0.2.0
  description: MiniAlalipay 对外 HTTP 契约。业务操作只有在本文件中具备完整 Schema 后才允许实现。
servers:
  - url: http://localhost:8080
    description: 本地网关
x-p0-interface-catalog: ./p0-interface-catalog.yaml
paths:
  /internal/v1/auth/sessions/introspect:
    post:
      summary: 网关校验用户中心会话并解析可信用户身份
      operationId: introspectSession
      x-client-scope: INTERNAL
      security:
        - internalServiceAuth: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SessionIntrospectionRequest' } } }
      responses:
        '200': { description: 返回会话有效性及真实用户身份, content: { application/json: { schema: { $ref: '#/components/schemas/SessionIntrospectionResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/auth/register:
    post:
      summary: 使用手机号、真实姓名和两套密码注册并自动开立零余额账户
      operationId: registerUser
      x-client-scope: C
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } }
      responses:
        '200': { description: 注册及开户成功, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/auth/login:
    post:
      summary: 使用手机号或系统账户号和登录密码登录
      operationId: loginUser
      x-client-scope: C
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: 登录成功, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/login-password:
    patch:
      summary: 校验当前密码后修改登录密码并使该用户全部会话失效
      operationId: changeLoginPassword
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangeLoginPasswordRequest' } } }
      responses:
        '200': { description: 修改成功，该用户全部旧令牌失效，客户端必须重新登录 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/auth/me:
    get:
      summary: 查询当前身份（展示名与真实角色）
      description: 使用网关注入的可信用户身份查询当前展示名与角色集合，供 B 端权限模型填充。普通用户无角色授权时返回默认 USER。
      operationId: getCurrentIdentity
      x-client-scope: B
      responses:
        '200': { description: 返回当前身份, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentIdentityResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/auth/logout:
    post:
      summary: 用户退出登录并销毁会话令牌
      operationId: logoutUser
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200': { description: 退出成功，令牌已失效 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /actuator/health:
    get:
      summary: 网关健康检查
      operationId: gatewayHealth
      x-client-scope: SHARED
      security: []
      responses:
        '200':
          description: 网关可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/me:
    get:
      summary: 查询本人账户和实时余额
      operationId: getMyAccount
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: 返回本人账户状态和实时余额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/me/entries:
    get:
      summary: 查询本人不可变账本明细
      operationId: listMyEntries
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: cursor
          in: query
          required: false
          description: 上一页响应返回的不透明复合游标，内部绑定分录创建时间与分录 ID；首页不传。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: limit
          in: query
          required: false
          description: 单页数量，最大 100。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 返回本人账本科目的游标分页明细
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntryPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/me/analytics:
    get:
      summary: 查询本人资产收支分析
      operationId: getMyAnalytics
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [7d, 30d, month], default: 7d }
      responses:
        '200':
          description: 返回已过账账本统计结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountAnalyticsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/transfer-drafts:
    post:
      summary: 创建主动转账草稿
      operationId: createTransferDraft
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferDraftRequest'
      responses:
        '200':
          description: 返回新建或幂等命中的本人草稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferDraftResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/transfer-drafts/{id}:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 26 }
    get:
      summary: 查询本人转账草稿
      operationId: getTransferDraft
      x-client-scope: C
      responses:
        '200':
          description: 返回本人草稿
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferDraftResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: 使用版本 CAS 编辑转账草稿
      operationId: updateTransferDraft
      x-client-scope: C
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTransferDraftRequest' }
      responses:
        '200':
          description: 返回递增版本后的草稿
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferDraftResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/transfer-drafts/{id}/validate:
    post:
      summary: 校验转账草稿但不修改余额
      operationId: validateTransferDraft
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 26 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftVersionRequest' }
      responses:
        '200':
          description: 返回风险预校验结果和新版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferValidationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/confirmations:
    post:
      summary: 为已校验草稿签发一次性确认令牌
      operationId: issueConfirmation
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueConfirmationRequest' }
      responses:
        '200':
          description: 原始令牌只在本次响应返回且两分钟有效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/transfers:
    post:
      summary: 提交已确认的普通转账
      operationId: submitTransfer
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitTransferRequest' }
      responses:
        '202':
          description: 交易已受理，客户端应按状态 URL 查询
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferTransactionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/transfers/{id}:
    get:
      summary: 查询本人参与的普通转账详情与权威状态
      description: 付款人和收款人均可查询；无关用户按交易不存在处理，避免泄露交易事实。
      operationId: getTransfer
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 26 }
      responses:
        '200':
          description: 返回交易状态、付款人、收款人、备注和时间
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferTransactionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/transfers/{id}/receipt:
    get:
      summary: 查询确定终态转账回执
      operationId: getTransferReceipt
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 26 }
      responses:
        '200':
          description: 返回成功、取消或冲正终态回执
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferReceiptResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/users/search:
    get:
      summary: 按手机号搜索用户（用于转账收款人查找）
      operationId: searchUsers
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: keyword
          in: query
          required: true
          description: 搜索关键词，目支持 11 位手机号
          schema: { type: string, minLength: 1, maxLength: 32 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: 返回匹配的用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/UserSearchResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/contacts:
    get:
      summary: 查询当前用户的常用联系人列表
      operationId: listContacts
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200':
          description: 返回常用联系人列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/contacts/{payeeUserId}:
    patch:
      summary: 更新联系人属性
      operationId: updateContact
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: payeeUserId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContactRequest' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/v1/accounts/registrations/{registrationId}:
    put:
      summary: 按注册编号幂等创建账户体系
      operationId: provisionAccount
      x-client-scope: INTERNAL
      x-service-auth: required
      servers: [{ url: http://localhost:8083 }]
      security: [{ internalServiceAuth: [] }]
      parameters:
        - name: registrationId
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26, pattern: '^(REG[A-Z]{9}\d{14}|[0-9A-HJKMNP-TV-Z]{26})$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisionAccountRequest' }
      responses:
        '200':
          description: 返回已创建或幂等命中的账户摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSummaryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/accounts/by-user/{userId}:
    get:
      summary: 解析用户唯一个人账户
      operationId: resolvePersonalAccount
      x-client-scope: INTERNAL
      x-service-auth: required
      servers: [{ url: http://localhost:8083 }]
      security: [{ internalServiceAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26, pattern: '^(USR[A-Z]{9}\d{14}|[0-9A-HJKMNP-TV-Z]{26})$' }
      responses:
        '200':
          description: 返回不含余额的账户引用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalAccountReference' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/v1/credit-accounts/by-user/{userId}:
    get:
      summary: 解析用户信用账户版本化引用
      operationId: resolveCreditAccount
      x-client-scope: INTERNAL
      x-service-auth: required
      servers: [{ url: http://localhost:8083 }]
      security: [{ internalServiceAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26, pattern: '^(USR[A-Z]{9}\d{14}|[0-9A-HJKMNP-TV-Z]{26})$' }
      responses:
        '200':
          description: 返回不含额度数值的信用账户 ID、状态和 CAS 版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalCreditAccountReference' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/v1/tcc/balance/{role}/{action}:
    post:
      summary: 执行付款方或收款方余额 TCC 分支
      operationId: executeBalanceTccBranch
      x-client-scope: INTERNAL
      x-service-auth: required
      servers: [{ url: http://localhost:8083 }]
      security: [{ internalServiceAuth: [] }]
      parameters:
        - name: role
          in: path
          required: true
          schema: { type: string, enum: [payer, payee] }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [try, confirm, cancel] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BalanceTccCommand' }
      responses:
        '200':
          description: 返回余额分支状态和空回滚类型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceTccBranchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/tcc/ledger/{action}:
    post:
      summary: 执行复式账本 TCC 分支
      operationId: executeLedgerTccBranch
      x-client-scope: INTERNAL
      x-service-auth: required
      servers: [{ url: http://localhost:8083 }]
      security: [{ internalServiceAuth: [] }]
      parameters:
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [try, confirm, cancel] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LedgerTccCommand' }
      responses:
        '200':
          description: 返回账本分支状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TccBranchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/tcc/credit-ledger/{action}:
    post:
      summary: 执行信用支付专用账本 TCC 分支
      description: 该分支固定借记信用应收资产、贷记收款用户余额负债；请求不接受 payerAccountId，禁止将信用账户作为余额付款账户。
      operationId: executeCreditPayLedgerTccBranch
      x-client-scope: INTERNAL
      x-service-auth: required
      servers: [{ url: http://localhost:8083 }]
      security: [{ internalServiceAuth: [] }]
      parameters:
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [try, confirm, cancel] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreditPayLedgerTccCommand' }
      responses:
        '200':
          description: 返回信用支付账本分支状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TccBranchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/tcc/credit-ledger/{action}:
    post:
      summary: 执行信用支付专用账本 TCC 分支
      description: 该分支固定借记信用应收资产、贷记收款用户余额负债；请求不接受 payerAccountId，禁止将信用账户作为余额付款账户。
      operationId: executeCreditPayLedgerTccBranch
      x-client-scope: INTERNAL
      x-service-auth: required
      servers: [{ url: http://localhost:8083 }]
      security: [{ internalServiceAuth: [] }]
      parameters:
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [try, confirm, cancel] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreditPayLedgerTccCommand' }
      responses:
        '200':
          description: 返回信用支付账本分支状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TccBranchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/transaction-facts/{transactionId}:
    get:
      summary: 查询终态发布所需的脱敏资金事实
      operationId: getTransactionFacts
      x-client-scope: INTERNAL
