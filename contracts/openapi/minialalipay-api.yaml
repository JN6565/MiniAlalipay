openapi: 3.1.0
info:
  title: MiniAlalipay API
  version: 0.3.0
  description: MiniAlalipay 外部与服务间 HTTP 契约。业务操作只有在本文件中具备完整 Schema 后才允许实现。
servers:
  - url: http://localhost:8080
    description: 本地网关
x-p0-interface-catalog: ./p0-interface-catalog.yaml
paths:
  /actuator/health:
    get:
      summary: 网关健康检查
      operationId: gatewayHealth
      x-client-scope: SHARED
      security: []
      responses:
        '200':
          description: 网关可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/me:
    get:
      summary: 查询本人账户和实时余额
      operationId: getMyAccount
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: 返回本人账户状态和实时余额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/me/entries:
    get:
      summary: 查询本人不可变账本明细
      operationId: listMyEntries
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: cursor
          in: query
          required: false
          description: 上一页响应返回的不透明复合游标，内部绑定分录创建时间与分录 ID；首页不传。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: limit
          in: query
          required: false
          description: 单页数量，最大 100。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 返回本人账本科目的游标分页明细
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntryPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/transfer-drafts:
    post:
      summary: 创建主动转账草稿
      operationId: createTransferDraft
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferDraftRequest'
      responses:
        '200':
          description: 返回新建或幂等命中的本人草稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferDraftResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/transfer-drafts/{id}:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 26 }
    get:
      summary: 查询本人转账草稿
      operationId: getTransferDraft
      x-client-scope: C
      responses:
        '200':
          description: 返回本人草稿
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferDraftResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: 使用版本 CAS 编辑转账草稿
      operationId: updateTransferDraft
      x-client-scope: C
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTransferDraftRequest' }
      responses:
        '200':
          description: 返回递增版本后的草稿
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferDraftResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/transfer-drafts/{id}/validate:
    post:
      summary: 校验转账草稿但不修改余额
      operationId: validateTransferDraft
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 26 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftVersionRequest' }
      responses:
        '200':
          description: 返回风险预校验结果和新版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferValidationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/confirmations:
    post:
      summary: 为已校验草稿签发一次性确认令牌
      operationId: issueConfirmation
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueConfirmationRequest' }
      responses:
        '200':
          description: 原始令牌只在本次响应返回且两分钟有效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/transfers:
    post:
      summary: 提交已确认的普通转账
      operationId: submitTransfer
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitTransferRequest' }
      responses:
        '202':
          description: 交易已受理，客户端应按状态 URL 查询
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferTransactionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/transfers/{id}:
    get:
      summary: 查询本人普通转账权威状态
      operationId: getTransfer
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 26 }
      responses:
        '200':
          description: 返回统一交易状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferTransactionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/transfers/{id}/receipt:
    get:
      summary: 查询确定终态转账回执
      operationId: getTransferReceipt
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 26 }
      responses:
        '200':
          description: 返回成功、取消或冲正终态回执
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferReceiptResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/accounts/registrations/{registrationId}:
    put:
      summary: 用户注册时幂等创建账户体系
      operationId: provisionAccount
      x-client-scope: INTERNAL
      servers: [{ url: 'http://localhost:8083', description: 本地账户中心直连地址 }]
      security:
        - internalServiceAuth: []
      parameters:
        - name: registrationId
          in: path
          required: true
          description: 用户中心生成并持久化的注册幂等编号。
          schema: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisionAccountRequest' }
      responses:
        '200':
          description: 返回已创建或既有账户的零余额摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSummaryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/accounts/by-user/{userId}:
    get:
      summary: 解析用户唯一个人账户引用
      operationId: resolvePersonalAccount
      x-client-scope: INTERNAL
      servers: [{ url: 'http://localhost:8083', description: 本地账户中心直连地址 }]
      security:
        - internalServiceAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
      responses:
        '200':
          description: 返回账户引用和状态，不返回余额
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalAccountReference' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/tcc/balance/{role}/{action}:
    post:
      summary: 执行付款或收款余额 TCC 分支
      operationId: executeBalanceTccBranch
      x-client-scope: INTERNAL
      servers: [{ url: 'http://localhost:8083', description: 本地账户中心直连地址 }]
      security:
        - internalServiceAuth: []
      parameters:
        - name: role
          in: path
          required: true
          schema: { type: string, enum: [payer, payee] }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [try, confirm, cancel] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BalanceTccCommand' }
      responses:
        '200':
          description: 返回幂等分支状态和空回滚类型
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TccBranchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/tcc/ledger/{action}:
    post:
      summary: 执行复式账本 TCC 分支
      operationId: executeLedgerTccBranch
      x-client-scope: INTERNAL
      servers: [{ url: 'http://localhost:8083', description: 本地账户中心直连地址 }]
      security:
        - internalServiceAuth: []
      parameters:
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [try, confirm, cancel] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LedgerTccCommand' }
      responses:
        '200':
          description: 返回账本分支状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TccBranchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/transaction-facts/{transactionId}:
    get:
      summary: 查询终态发布所需的脱敏资金事实
      operationId: getTransactionFacts
      x-client-scope: INTERNAL
      servers: [{ url: 'http://localhost:8083', description: 本地账户中心直连地址 }]
      security:
        - internalServiceAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
      responses:
        '200':
          description: 返回成功和取消两组互斥一致性事实
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionFacts' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/reconciliation-diffs:
    post:
      summary: 幂等追加终态核验对账差异
      operationId: recordReconciliationDiff
      x-client-scope: INTERNAL
      servers: [{ url: 'http://localhost:8083', description: 本地账户中心直连地址 }]
      security:
        - internalServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconciliationDiffRequest' }
      responses:
        '204': { description: 差异已记录或幂等命中 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 会话令牌
      description: 由网关验证的会话令牌，不得写入日志或 URL。
    cookieAuth:
      type: apiKey
      in: cookie
      name: MINIALALIPAY_SESSION
      description: HttpOnly、Secure、SameSite Cookie；写请求同时校验 CSRF 令牌。
    internalServiceAuth:
      type: mutualTLS
      description: 服务间双向 TLS 身份认证；内部路径不注册网关路由，本地联调可由受控开发网络终止 TLS。
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: 客户端请求编号；缺失或不合法时由网关生成。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 写操作幂等键，同一主体和接口作用域至少保留 24 小时。
      schema:
        type: string
        minLength: 16
        maxLength: 64
        pattern: '^[A-Za-z0-9._:-]+$'
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Cookie 会话写请求使用的会话绑定防跨站请求伪造令牌。
      schema:
        type: string
        minLength: 16
        maxLength: 256
    LastEventIdHeader:
      name: Last-Event-ID
      in: header
      required: false
      description: SSE 断线续传游标。
      schema:
        type: string
        maxLength: 128
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          example: UP
    ApiResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId, traceId, data]
      properties:
        code:
          type: string
          description: 稳定的机器可读结果码。
          example: OK
        message:
          type: string
          description: 面向调用方的中文说明。
          example: 成功
        requestId:
          type: string
          description: 一次网关请求的编号。
          example: req_01K1ABCDEF2GH3JK4MN5PQRSTV
        traceId:
          type: [string, 'null']
          description: 跨服务链路编号；链路尚未建立时为空。
          example: 6f8b0f0a0ad64fd1b9eb5be13e146a82
        data:
          description: 业务数据；错误响应只允许包含安全、可操作的冲突信息。
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: [object, 'null']
              additionalProperties: true
    AccountSummary:
      type: object
      additionalProperties: false
      required: [accountId, accountType, currency, status, availableFen, frozenFen, totalFen, version]
      properties:
        accountId:
          type: string
          minLength: 1
          maxLength: 26
          description: 本人虚拟账户 ID。
        accountType:
          type: string
          enum: [PERSONAL]
          description: 账户类型，当前只返回个人账户。
        currency:
          type: string
          enum: [CNY]
          description: ISO 4217 币种代码，当前固定人民币。
        status:
          type: string
          enum: [ACTIVE, FROZEN, CLOSED]
          description: 账户生命周期状态。
        availableFen:
          type: integer
          format: int64
          minimum: 0
          description: 可用金额，单位分。
        frozenFen:
          type: integer
          format: int64
          minimum: 0
          description: TCC Try 已冻结金额，单位分。
        totalFen:
          type: integer
          format: int64
          minimum: 0
          description: 总金额，恒等于 availableFen 与 frozenFen 之和。
        version:
          type: integer
          format: int64
          minimum: 0
          description: 余额 CAS 版本。
    AccountSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AccountSummary'
    ProvisionAccountRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          minLength: 26
          maxLength: 26
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: 用户中心已经持久化的用户 ID。
    InternalAccountReference:
      type: object
      additionalProperties: false
      required: [accountId, userId, status]
      properties:
        accountId: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        userId: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        status: { type: string, enum: [ACTIVE, FROZEN, CLOSED] }
    BalanceTccCommand:
      type: object
      additionalProperties: false
      required: [xid, transactionId, accountId, amountFen, freezeId]
      properties:
        xid: { type: string, minLength: 1, maxLength: 128 }
        transactionId: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        accountId: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        amountFen: { type: integer, format: int64, minimum: 1 }
        freezeId: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    TccBranchResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [INIT, TRIED, CONFIRMED, CANCELLED] }
        rollbackType: { type: [string, 'null'], enum: [EMPTY, NORMAL, null] }
    LedgerTccCommand:
      type: object
      additionalProperties: false
      required: [xid, transactionId, payerAccountId, payeeAccountId, amountFen, voucherId,
                 debitEntryId, creditEntryId, eventId, traceId]
      properties:
        xid: { type: string, minLength: 1, maxLength: 128 }
        transactionId: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        payerAccountId: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        payeeAccountId: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        amountFen: { type: integer, format: int64, minimum: 1 }
        voucherId: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        debitEntryId: { type: integer, format: int64, minimum: 1 }
        creditEntryId: { type: integer, format: int64, minimum: 1 }
        eventId: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        traceId: { type: string, pattern: '^[a-fA-F0-9]{32}$' }
    TransactionFacts:
      type: object
      additionalProperties: false
      required: [successConsistent, cancelConsistent, accountsConfirmed, ledgerConfirmed,
                 freezeConfirmed, ledgerPosted, accountsCancelled, ledgerCancelled, noActiveFreeze]
      properties:
        successConsistent: { type: boolean }
        cancelConsistent: { type: boolean }
        accountsConfirmed: { type: boolean }
        ledgerConfirmed: { type: boolean }
        freezeConfirmed: { type: boolean }
        ledgerPosted: { type: boolean }
        accountsCancelled: { type: boolean }
        ledgerCancelled: { type: boolean }
        noActiveFreeze: { type: boolean }
    ReconciliationDiffRequest:
      type: object
      additionalProperties: false
      required: [diffId, transactionId, diffType, expectedJson, actualJson, manualCaseId, traceId, detectedAt]
      properties:
        diffId: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        transactionId: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        diffType: { type: string, minLength: 1, maxLength: 64 }
        expectedJson: { type: string, minLength: 2, maxLength: 4096, description: 仅包含脱敏预期事实的 JSON 文本。 }
        actualJson: { type: string, minLength: 2, maxLength: 4096, description: 仅包含脱敏实际事实的 JSON 文本。 }
        manualCaseId: { type: string, minLength: 26, maxLength: 26, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        traceId: { type: string, pattern: '^[a-fA-F0-9]{32}$' }
        detectedAt: { type: string, format: date-time }
    LedgerEntry:
      type: object
      additionalProperties: false
      required: [entryId, transactionId, direction, amountFen, memo, createdAt]
      properties:
        entryId:
          type: integer
          format: int64
          minimum: 1
          description: 不可变分录 ID，与 createdAt 共同组成服务端不透明分页游标。
        transactionId:
          type: string
          minLength: 1
          maxLength: 26
          description: 统一资金交易 ID。
        direction:
          type: string
          enum: [DEBIT, CREDIT]
          description: 会计借贷方向，不代表用户借款。
        amountFen:
          type: integer
          format: int64
          minimum: 1
          description: 分录金额，单位分。
        memo:
          type: [string, 'null']
          maxLength: 255
          description: 已脱敏的分录摘要。
        createdAt:
          type: string
          format: date-time
          description: 分录创建时间。
    LedgerEntryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LedgerEntry'
        nextCursor:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          description: 绑定创建时间与分录 ID 的下一页不透明游标；没有更多数据时为空。
    LedgerEntryPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/LedgerEntryPage'
    CreateTransferDraftRequest:
      type: object
      additionalProperties: false
      required: [payeeUserId, amountFen]
      properties:
        payeeUserId: { type: string, minLength: 1, maxLength: 26, description: 明确选择的收款用户 ID。 }
        amountFen: { type: integer, format: int64, minimum: 1, maximum: 5000000, description: 转账金额，单位分。 }
        remark: { type: [string, 'null'], maxLength: 128, description: 用户可见转账备注。 }
    UpdateTransferDraftRequest:
      type: object
      additionalProperties: false
      required: [version, amountFen]
      properties:
        version: { type: integer, format: int64, minimum: 0, description: 客户端读取到的草稿 CAS 版本。 }
        amountFen: { type: integer, format: int64, minimum: 1, maximum: 5000000, description: 修改后金额，单位分。 }
        remark: { type: [string, 'null'], maxLength: 128 }
    DraftVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
    IssueConfirmationRequest:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId, subjectVersion, paymentProof]
      properties:
        subjectType: { type: string, enum: [TRANSFER_DRAFT] }
        subjectId: { type: string, minLength: 1, maxLength: 26 }
        subjectVersion: { type: integer, format: int64, minimum: 0 }
        paymentProof: { type: string, minLength: 1, maxLength: 256, description: 用户中心签发的一次性短期支付密码证明，不得记录日志。 }
    SubmitTransferRequest:
      type: object
      additionalProperties: false
      required: [draftId, confirmationToken]
      properties:
        draftId: { type: string, minLength: 1, maxLength: 26 }
        confirmationToken: { type: string, minLength: 1, maxLength: 256, description: 两分钟有效的一次性确认令牌，不得进入 URL 或日志。 }
    TransferDraft:
      type: object
      additionalProperties: false
      required: [draftId, payeeUserId, amountFen, remark, status, version, expiresAt]
      properties:
        draftId: { type: string, minLength: 1, maxLength: 26 }
        payeeUserId: { type: string, minLength: 1, maxLength: 26 }
        amountFen: { type: integer, format: int64, minimum: 1, maximum: 5000000 }
        remark: { type: [string, 'null'], maxLength: 128 }
        status: { type: string, enum: [DRAFT, VALIDATED, PENDING_CONFIRMATION, SUBMITTED, EXPIRED] }
        version: { type: integer, format: int64, minimum: 0 }
        expiresAt: { type: string, format: date-time }
    TransferTransaction:
      type: object
      additionalProperties: false
      required: [transactionId, businessType, status, amountFen, statusUrl, updatedAt]
      properties:
        transactionId: { type: string, minLength: 1, maxLength: 26 }
        businessType: { type: string, enum: [TRANSFER] }
        status: { type: string, enum: [PROCESSING, COMPENSATING, MANUAL_REVIEW, SUCCESS, REVERSED, CANCELLED] }
        amountFen: { type: integer, format: int64, minimum: 1, maximum: 5000000 }
        statusUrl: { type: string, pattern: '^/api/v1/transfers/' }
        updatedAt: { type: string, format: date-time }
    TransferDraftResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties: { data: { $ref: '#/components/schemas/TransferDraft' } }
    TransferValidationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [result, riskLevel, version]
              properties:
                result: { type: string, enum: [PASS, MANUAL] }
                riskLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
                version: { type: integer, format: int64, minimum: 0 }
    ConfirmationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [confirmationToken, subjectHash, expiresAt]
              properties:
                confirmationToken: { type: string, description: 仅本次响应返回的原始确认令牌。 }
                subjectHash: { type: string, pattern: '^sha256:' }
                expiresAt: { type: string, format: date-time }
    TransferTransactionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { $ref: '#/components/schemas/TransferTransaction' } }
    TransferReceiptResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [transactionId, status, amountFen, completedAt]
              properties:
                transactionId: { type: string, minLength: 1, maxLength: 26 }
                status: { type: string, enum: [SUCCESS, REVERSED, CANCELLED] }
                amountFen: { type: integer, format: int64, minimum: 1 }
                completedAt: { type: string, format: date-time }
  responses:
    BadRequest:
      description: 请求格式或字段不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未认证或会话失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF、角色或对象级权限拒绝
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 幂等、版本、状态或唯一约束冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在或调用方无权感知
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: 请求使用了目标资源不支持的 HTTP 方法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotAcceptable:
      description: 无法生成客户端声明可以接收的响应格式
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: 请求正文使用了接口不支持的媒体类型
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: 订单、请求或事件游标已经过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: 可理解的业务规则拒绝
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 请求超过频率或安全尝试限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 未分类内部错误，不返回内部细节
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: TCC、模型或关键依赖暂不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
  - bearerAuth: []
  - cookieAuth: []
