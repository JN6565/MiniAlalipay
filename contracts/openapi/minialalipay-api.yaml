        - name: jobCode
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - name: ruleCode
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
      responses:
        '200': { description: 返回已脱敏质量结果, content: { application/json: { schema: { $ref: '#/components/schemas/DataQualityPageResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/ops/metric-definitions:
    get:
      summary: 查询历史指标口径版本
      operationId: listMetricDefinitions
      x-client-scope: B
      parameters: [ { $ref: '#/components/parameters/RequestIdHeader' } ]
      responses:
        '200': { description: 返回只读指标定义, content: { application/json: { schema: { $ref: '#/components/schemas/MetricDefinitionPageResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/ops/transactions:
    get:
      summary: 分页查询全平台脱敏交易摘要
      operationId: listOpsTransactions
      x-client-scope: B
      parameters:
        - { $ref: '#/components/parameters/RequestIdHeader' }
        - { name: status, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: businessType, in: query, required: false, schema: { type: string, maxLength: 16 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 26 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200': { description: 返回脱敏交易分页, content: { application/json: { schema: { $ref: '#/components/schemas/OpsTransactionPageResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/ops/transactions/{id}:
    get:
      summary: 查询单笔脱敏交易详情与关联资金事实
      operationId: getOpsTransaction
      x-client-scope: B
      parameters:
        - { $ref: '#/components/parameters/RequestIdHeader' }
        - { $ref: '#/components/parameters/ResourceId' }
      responses:
        '200': { description: 返回脱敏交易详情, content: { application/json: { schema: { $ref: '#/components/schemas/OpsTransactionDetailResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/ops/transactions/{id}/trace:
    get:
      summary: 查询交易链路片段
      operationId: getOpsTransactionTrace
      x-client-scope: B
      parameters:
        - { $ref: '#/components/parameters/RequestIdHeader' }
        - { $ref: '#/components/parameters/ResourceId' }
      responses:
        '200': { description: 按交易归属链路编号返回跨服务脱敏 Span（业务中心、账户账本、用户审计、AI）, content: { application/json: { schema: { $ref: '#/components/schemas/TraceSpanListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/ops/traces/{traceId}:
    get:
      summary: 按链路编号查询跨服务链路片段
      operationId: getOpsTraceByTraceId
      x-client-scope: B
      parameters:
        - { $ref: '#/components/parameters/RequestIdHeader' }
        - { $ref: '#/components/parameters/ResourceId' }
      responses:
        '200': { description: 链路无已核验片段时返回空列表, content: { application/json: { schema: { $ref: '#/components/schemas/TraceSpanListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/ops/alert-rules:
    get:
      summary: 查询全部告警规则及阈值配置
      operationId: listAlertRules
      x-client-scope: B
      parameters: [ { $ref: '#/components/parameters/RequestIdHeader' } ]
      responses:
        '200': { description: 返回告警规则列表, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRuleListResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/ops/alert-rules/{ruleCode}/thresholds:
    post:
      summary: 按版本 CAS 更新告警规则阈值
      operationId: updateAlertRuleThreshold
      x-client-scope: B
      description: |
        阈值写入是幂等写操作（重复设置同一阈值无副作用），由规则版本 CAS 保证并发安全，无需幂等键。
      parameters:
        - { $ref: '#/components/parameters/RequestIdHeader' }
        - { name: ruleCode, in: path, required: true, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAlertRuleThresholdRequest' }
      responses:
        '200': { description: 返回更新后的告警规则, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRuleResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/agent/messages:
    post:
      summary: AI 多轮对话入口
      operationId: sendAgentMessage
      x-client-scope: C
      description: |
        向 AI Talk 发送一条自然语言消息。
        客户端通过 clientMessageId 保证消息幂等；首次对话时可省略 sessionId 让服务端自动创建新会话。
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendAgentMessageRequest' }
      responses:
        '200':
          description: AI 回复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendAgentMessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/agent/messages/stream:
    post:
      summary: AI 流式对话入口（SSE）
      operationId: streamAgentMessage
      x-client-scope: C
      description: |
        向 AI Talk 发送消息并通过 Server-Sent Events 接收流式响应。
        事件类型包括 agent-status、agent-content、agent-tool-call、agent-tool-result、agent-clarification、agent-done、agent-error。
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendAgentMessageRequest' }
      responses:
        '200':
          description: SSE 流式响应，Content-Type 为 text/event-stream
          content:
            text/event-stream:
              schema: { type: string, description: 'SSE 事件流，每个事件格式为 event: <type>\ndata: <json>\n\n' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/agent/sessions:
    get:
      summary: 查询当前用户的活跃 AI 会话列表
      operationId: listAgentSessions
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: 返回会话列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AgentSessionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/agent/sessions/{sessionId}/messages:
    get:
      summary: 查询指定会话的消息历史
      operationId: getAgentSessionMessages
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: sessionId
          in: path
          required: true
          schema: { type: string, maxLength: 26 }
      responses:
        '200':
          description: 返回会话消息列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AgentMessageSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 会话令牌
      description: 由网关验证的会话令牌，不得写入日志或 URL。
    cookieAuth:
      type: apiKey
      in: cookie
      name: MINIALALIPAY_SESSION
      description: HttpOnly、Secure、SameSite Cookie；写请求同时校验 CSRF 令牌。
    serviceAuth:
      type: apiKey
      in: header
      name: X-Service-Token
      description: 仅用于服务间鉴权的内部令牌，由部署环境注入，不得写入日志或经过前端网关。
    internalServiceAuth:
      type: apiKey
      in: header
      name: X-Internal-Service-Token
      description: 账户中心既有内部资金接口使用的服务身份令牌，不得经过前端网关或写入日志。
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: 客户端请求编号；缺失或不合法时由网关生成。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 写操作幂等键，同一主体和接口作用域至少保留 24 小时。
      schema:
        type: string
        minLength: 16
        maxLength: 64
        pattern: '^[A-Za-z0-9._:-]+$'
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Cookie 会话写请求使用的会话绑定防跨站请求伪造令牌。
      schema:
        type: string
        minLength: 16
        maxLength: 256
    LastEventIdHeader:
      name: Last-Event-ID
      in: header
      required: false
      description: SSE 断线续传游标。
      schema:
        type: string
        maxLength: 128
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 26 }
  schemas:
    SessionIntrospectionRequest:
      type: object
      additionalProperties: false
      required: [accessToken]
      properties:
        accessToken: { type: string, minLength: 16, description: 待校验的会话令牌，不得写入日志。 }
    SessionIntrospectionResponse:
      type: object
      additionalProperties: false
      required: [active, roles]
      properties:
        active: { type: boolean }
        userId: { type: [string, 'null'], description: 有效会话对应的真实用户 ID。 }
        roles: { type: array, items: { type: string } }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [phoneNumber, realName, loginPassword, paymentPassword]
      properties:
        phoneNumber: { type: string, pattern: '^1[3-9]\d{9}$', description: 中国大陆手机号，同一手机号只允许注册一次。 }
        realName: { type: string, minLength: 2, maxLength: 32, description: 真实姓名，用于转账收款人查询和确认展示。 }
        nickname: { type: string, maxLength: 20, description: 可选展示昵称；空缺时使用真实姓名。 }
        loginPassword: { type: string, format: password, minLength: 8, maxLength: 32 }
        paymentPassword: { type: string, format: password, pattern: '^\d{6}$', description: 6 位数字支付密码，不得记录日志。 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [loginIdentifier, loginPassword]
      properties:
        loginIdentifier: { type: string, minLength: 11, maxLength: 20, description: 完整手机号或系统生成的 16 位账户号。 }
        loginPassword: { type: string, format: password, minLength: 8, maxLength: 32 }
    ChangeLoginPasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, minLength: 8, maxLength: 32 }
        newPassword: { type: string, format: password, minLength: 8, maxLength: 32, description: 必须包含大写字母、小写字母和数字。 }
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [accessToken, userId, accountNumber, nickname, status]
              properties:
                accessToken: { type: string, minLength: 16 }
                userId: { type: string, minLength: 1, maxLength: 26 }
                accountNumber: { type: string, pattern: '^62\d{14}$', description: 系统生成的账户号，可用于登录。 }
                nickname: { type: string, minLength: 1, maxLength: 20 }
                status: { type: string, enum: [ACTIVE, PROVISIONING] }
    CurrentIdentityResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [userId, displayName, roles]
              properties:
                userId: { type: string, minLength: 1, maxLength: 26 }
                displayName: { type: string, minLength: 1, maxLength: 32, description: 展示名，真实姓名优先。 }
                roles: { type: array, items: { type: string, enum: [USER, MERCHANT, OPERATOR, ADMIN] }, description: 用户实际角色集合，至少包含默认角色。 }
    CreditSummary:
      type: object
      additionalProperties: false
      required: [creditAccountId, status, totalLimitFen, usedFen, frozenFen, availableFen, unbilledFen, billedFen, overdueFen]
      properties:
        creditAccountId: { type: string, minLength: 1, maxLength: 26 }
        status: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
        totalLimitFen: { type: integer, format: int64, const: 500000, description: 固定虚拟授信总额，单位分。 }
        usedFen: { type: integer, format: int64, minimum: 0 }
        frozenFen: { type: integer, format: int64, minimum: 0 }
        availableFen: { type: integer, format: int64, minimum: 0 }
        unbilledFen: { type: integer, format: int64, minimum: 0 }
        billedFen: { type: integer, format: int64, minimum: 0 }
        overdueFen: { type: integer, format: int64, minimum: 0 }
    CreditSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties: { data: { $ref: '#/components/schemas/CreditSummary' } }
    CreditPurchase:
      type: object
      additionalProperties: false
      required: [purchaseId, creditTransactionId, qrOrderId, amountFen, repaidFen, outstandingFen, billingStatus, occurredAt]
      properties:
        purchaseId: { type: string, minLength: 1, maxLength: 26 }
        creditTransactionId: { type: string, minLength: 1, maxLength: 26 }
        qrOrderId: { type: string, minLength: 1, maxLength: 26 }
        amountFen: { type: integer, format: int64, minimum: 1, maximum: 5000000 }
        repaidFen: { type: integer, format: int64, minimum: 0 }
        outstandingFen: { type: integer, format: int64, minimum: 0 }
