openapi: 3.1.0
info:
  title: MiniAlalipay API
  version: 0.1.0
  description: Foundation contract. Business endpoints are added only with their acceptance tests and ownership rules.
servers:
  - url: http://localhost:8080
paths:
  /actuator/health:
    get:
      summary: Gateway health check
      operationId: gatewayHealth
      responses:
        '200':
          description: Gateway is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Standard gateway failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: COMMON_INTERNAL_ERROR
        message:
          type: string
          example: Internal server error
        requestId:
          type: string
          example: req_9c3bd41f
