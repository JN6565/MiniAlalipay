          description: 用户状态过滤，PROVISIONING/ACTIVE/DISABLED，为空表示不限定。
          schema: { type: string, enum: [PROVISIONING, ACTIVE, DISABLED] }
        - name: cursor
          in: query
          required: false
          description: 上一页最后一条 userId 游标，为空表示第一页。
          schema: { type: string, maxLength: 26 }
        - name: limit
          in: query
          required: false
          description: 每页最大条数，1~100。
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: 返回脱敏用户分页, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserPageResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/users/{userId}/freeze:
    post:
      summary: 管理冻结用户（系统管理员）
      description: 仅 ACTIVE 可冻结；CAS 版本保护并发，记录操作者与冻结理由，冻结后禁止登录。
      operationId: freezeAdminUser
      x-client-scope: B
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: userId
          in: path
          required: true
          description: 目标用户 ID（ULID）。
          schema: { type: string, minLength: 26, maxLength: 26 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FreezeUserRequest' } } }
      responses:
        '200': { description: 返回冻结后的用户视图（含最新版本）, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/users/{userId}/unfreeze:
    post:
      summary: 管理解冻用户（系统管理员）
      description: 仅 DISABLED 可解冻；CAS 版本保护并发，解冻后恢复登录并清空冻结审计字段。
      operationId: unfreezeAdminUser
      x-client-scope: B
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: userId
          in: path
          required: true
          description: 目标用户 ID（ULID）。
          schema: { type: string, minLength: 26, maxLength: 26 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnfreezeUserRequest' } } }
      responses:
        '200': { description: 返回解冻后的用户视图（含最新版本）, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/ops/daily-reports:
    get:
      summary: 查询通过质量门禁的 T+1 报表
      operationId: listDailyReports
      x-client-scope: B
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: reportDate
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200': { description: 返回指标口径与质量版本, content: { application/json: { schema: { $ref: '#/components/schemas/DailyReportPageResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/ops/alerts/{id}/acknowledge:
    post:
      summary: 确认告警
      operationId: acknowledgeAlert
      x-client-scope: B
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AcknowledgeAlertRequest' } } }
      responses:
        '200': { description: 返回 CAS 更新后的告警, content: { application/json: { schema: { $ref: '#/components/schemas/AlertResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/ops/alerts/{id}/resolve:
    post:
      summary: 标记告警已解决
      operationId: resolveAlert
      x-client-scope: B
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResolveAlertRequest' } } }
      responses:
        '200': { description: 证据已审计并返回告警, content: { application/json: { schema: { $ref: '#/components/schemas/AlertResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/ops/alerts/{id}/close:
    post:
      summary: 关闭已恢复的告警
      operationId: closeAlert
      x-client-scope: B
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CloseAlertRequest' } } }
      responses:
        '200': { description: 仅 RESOLVED 到 CLOSED 的 CAS 更新, content: { application/json: { schema: { $ref: '#/components/schemas/AlertResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/ops/data-quality:
    get:
      summary: 查询数据质量结果
      description: 数据质量为 FAILED 时不向运营展示指标数值；WARNING 必须携带风险标记。
