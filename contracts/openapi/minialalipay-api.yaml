openapi: 3.1.0
info:
  title: MiniAlalipay API
  version: 0.2.0
  description: MiniAlalipay 对外 HTTP 契约。业务操作只有在本文件中具备完整 Schema 后才允许实现。
servers:
  - url: http://localhost:8080
    description: 本地网关
x-p0-interface-catalog: ./p0-interface-catalog.yaml
paths:
  /actuator/health:
    get:
      summary: 网关健康检查
      operationId: gatewayHealth
      x-client-scope: SHARED
      security: []
      responses:
        '200':
          description: 网关可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/me:
    get:
      summary: 查询本人账户和实时余额
      operationId: getMyAccount
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: 返回本人账户状态和实时余额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/accounts/me/entries:
    get:
      summary: 查询本人不可变账本明细
      operationId: listMyEntries
      x-client-scope: C
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: cursor
          in: query
          required: false
          description: 上一页响应返回的不透明复合游标，内部绑定分录创建时间与分录 ID；首页不传。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: limit
          in: query
          required: false
          description: 单页数量，最大 100。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 返回本人账本科目的游标分页明细
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntryPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 会话令牌
      description: 由网关验证的会话令牌，不得写入日志或 URL。
    cookieAuth:
      type: apiKey
      in: cookie
      name: MINIALALIPAY_SESSION
      description: HttpOnly、Secure、SameSite Cookie；写请求同时校验 CSRF 令牌。
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: 客户端请求编号；缺失或不合法时由网关生成。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 写操作幂等键，同一主体和接口作用域至少保留 24 小时。
      schema:
        type: string
        minLength: 16
        maxLength: 64
        pattern: '^[A-Za-z0-9._:-]+$'
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Cookie 会话写请求使用的会话绑定防跨站请求伪造令牌。
      schema:
        type: string
        minLength: 16
        maxLength: 256
    LastEventIdHeader:
      name: Last-Event-ID
      in: header
      required: false
      description: SSE 断线续传游标。
      schema:
        type: string
        maxLength: 128
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          example: UP
    ApiResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId, traceId, data]
      properties:
        code:
          type: string
          description: 稳定的机器可读结果码。
          example: OK
        message:
          type: string
          description: 面向调用方的中文说明。
          example: 成功
        requestId:
          type: string
          description: 一次网关请求的编号。
          example: req_01K1ABCDEF2GH3JK4MN5PQRSTV
        traceId:
          type: [string, 'null']
          description: 跨服务链路编号；链路尚未建立时为空。
          example: 6f8b0f0a0ad64fd1b9eb5be13e146a82
        data:
          description: 业务数据；错误响应只允许包含安全、可操作的冲突信息。
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: [object, 'null']
              additionalProperties: true
    AccountSummary:
      type: object
      additionalProperties: false
      required: [accountId, accountType, currency, status, availableFen, frozenFen, totalFen, version]
      properties:
        accountId:
          type: string
          minLength: 1
          maxLength: 26
          description: 本人虚拟账户 ID。
        accountType:
          type: string
          enum: [PERSONAL]
          description: 账户类型，当前只返回个人账户。
        currency:
          type: string
          enum: [CNY]
          description: ISO 4217 币种代码，当前固定人民币。
        status:
          type: string
          enum: [ACTIVE, FROZEN, CLOSED]
          description: 账户生命周期状态。
        availableFen:
          type: integer
          format: int64
          minimum: 0
          description: 可用金额，单位分。
        frozenFen:
          type: integer
          format: int64
          minimum: 0
          description: TCC Try 已冻结金额，单位分。
        totalFen:
          type: integer
          format: int64
          minimum: 0
          description: 总金额，恒等于 availableFen 与 frozenFen 之和。
        version:
          type: integer
          format: int64
          minimum: 0
          description: 余额 CAS 版本。
    AccountSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AccountSummary'
    LedgerEntry:
      type: object
      additionalProperties: false
      required: [entryId, transactionId, direction, amountFen, memo, createdAt]
      properties:
        entryId:
          type: integer
          format: int64
          minimum: 1
          description: 不可变分录 ID，与 createdAt 共同组成服务端不透明分页游标。
        transactionId:
          type: string
          minLength: 1
          maxLength: 26
          description: 统一资金交易 ID。
        direction:
          type: string
          enum: [DEBIT, CREDIT]
          description: 会计借贷方向，不代表用户借款。
        amountFen:
          type: integer
          format: int64
          minimum: 1
          description: 分录金额，单位分。
        memo:
          type: [string, 'null']
          maxLength: 255
          description: 已脱敏的分录摘要。
        createdAt:
          type: string
          format: date-time
          description: 分录创建时间。
    LedgerEntryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LedgerEntry'
        nextCursor:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          description: 绑定创建时间与分录 ID 的下一页不透明游标；没有更多数据时为空。
    LedgerEntryPageResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/LedgerEntryPage'
  responses:
    BadRequest:
      description: 请求格式或字段不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未认证或会话失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF、角色或对象级权限拒绝
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 幂等、版本、状态或唯一约束冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在或调用方无权感知
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: 请求使用了目标资源不支持的 HTTP 方法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotAcceptable:
      description: 无法生成客户端声明可以接收的响应格式
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: 请求正文使用了接口不支持的媒体类型
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: 订单、请求或事件游标已经过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: 可理解的业务规则拒绝
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 请求超过频率或安全尝试限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 未分类内部错误，不返回内部细节
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: TCC、模型或关键依赖暂不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
  - bearerAuth: []
  - cookieAuth: []
