# Nginx 统一入口配置：
# - 443 端口（TLS）托管 C 端 H5；80 端口仅做 301 跳转。H5 扫码页需调用摄像头 API（getUserMedia），
#   浏览器规定该 API 只能在安全上下文（HTTPS/localhost）下使用，故 H5 必须经 HTTPS 访问
# - 81 端口托管 B 端管理端（无摄像头需求，保持 HTTP）
# - 两个站点均将 /api/ 反代到网关容器（compose 服务名 gateway:8080），前端同源调用无需 CORS
# - AI 对话为 SSE 流式响应，/api/v1/agent/ 关闭代理缓冲，保证逐 Token 推送
# - 证书位于 /etc/nginx/certs（宿主机 /opt/minialalipay/nginx/certs 只读挂载）；
#   当前为自签证书（见 README「HTTPS 与自签证书」），后续换正式证书只需替换该目录文件后重载

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # 上传与响应超时放宽，兼容 AI 长对话与文件类接口
    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    proxy_send_timeout    60s;

    # C 端 H5：HTTP 入口整体 301 到 HTTPS（摄像头等安全上下文 API 必须经 HTTPS）
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # C 端 H5 站点（HTTPS）
    server {
        listen 443 ssl;
        server_name _;

        # 自签证书：CN 与 SAN 均为服务器公网 IP；换正式证书时替换这两个文件即可
        ssl_certificate     /etc/nginx/certs/h5.crt;
        ssl_certificate_key /etc/nginx/certs/h5.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html/h5;
        index index.html;

        # AI 对话 SSE：关闭缓冲，逐块转发
        location /api/v1/agent/ {
            proxy_pass http://gateway:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }

        # 其余业务接口统一经网关
        location /api/ {
            proxy_pass http://gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 健康检查入口（运维用，可选在安全组限制来源）
        location /actuator/ {
            proxy_pass http://gateway:8080;
        }

        # H5 为单页应用，前端路由回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # B 端管理端站点
    server {
        listen 81;
        server_name _;

        root /usr/share/nginx/html/admin;
        index index.html;

        location /api/ {
            proxy_pass http://gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /actuator/ {
            proxy_pass http://gateway:8080;
        }

        # 管理端同为单页应用
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
