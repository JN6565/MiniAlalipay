# Nginx 统一入口配置：
# - 80 端口托管 C 端 H5，81 端口托管 B 端管理端（两个前端为独立工程，分开托管避免路由冲突）
# - 两个站点均将 /api/ 反代到网关容器（compose 服务名 gateway:8080），前端同源调用无需 CORS
# - AI 对话为 SSE 流式响应，/api/v1/agent/ 关闭代理缓冲，保证逐 Token 推送

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # 上传与响应超时放宽，兼容 AI 长对话与文件类接口
    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    proxy_send_timeout    60s;

    # C 端 H5 站点
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html/h5;
        index index.html;

        # AI 对话 SSE：关闭缓冲，逐块转发
        location /api/v1/agent/ {
            proxy_pass http://gateway:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }

        # 其余业务接口统一经网关
        location /api/ {
            proxy_pass http://gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 健康检查入口（运维用，可选在安全组限制来源）
        location /actuator/ {
            proxy_pass http://gateway:8080;
        }

        # H5 为单页应用，前端路由回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # B 端管理端站点
    server {
        listen 81;
        server_name _;

        root /usr/share/nginx/html/admin;
        index index.html;

        location /api/ {
            proxy_pass http://gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /actuator/ {
            proxy_pass http://gateway:8080;
        }

        # 管理端同为单页应用
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
