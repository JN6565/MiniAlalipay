server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: minialalipay-gateway
  cloud:
    gateway:
      routes:
        - id: user-center
          uri: ${USER_CENTER_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/contacts/**
        - id: business-center
          uri: ${BUSINESS_CENTER_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/transfers/**,/api/v1/qr-pay/**,/api/v1/p2p-collections/**,/api/v1/transactions/**,/api/v1/monitoring/**
        - id: account-center
          uri: ${ACCOUNT_CENTER_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/accounts/**,/api/v1/credit/**,/api/v1/bills/**
        - id: ai-service
          uri: ${AI_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/agent/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
