server:
  port: ${GATEWAY_PORT:8080}

spring:
  data:
    redis:
      host: ${REDIS_HOST:121.43.51.164}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:teamuser2026}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  cloud:
    gateway:
      routes:
        # ========== 用户中心路由 ==========
        - id: user-center-auth
          uri: ${USER_CENTER_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@loginKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        - id: user-center-api
          uri: ${USER_CENTER_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**,/api/v1/contacts/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
        # 支付密码校验使用更严格的用户维度限流
        - id: user-center-password
          uri: ${USER_CENTER_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/payment-password/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@paymentPasswordKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1

        # ========== 业务中心路由（仅已实现 Controller 的操作） ==========
        - id: business-center-transfers
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/transfers/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
        # ---- 以下路由已列入契约但对应 Controller 尚未实现，暂禁用 ----
        # 二维码非资金来源订单已实现；确认与支付仍由业务中心受控返回依赖不可用。
        - id: business-center-qr-pay
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/qr-pay/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 30
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-p2p-collections
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/p2p-collections/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 30
                redis-rate-limiter.requestedTokens: 1
        # transactions → 王钧平 阶段四已完成，Controller 待补充
        - id: business-center-recharges
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/recharges/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-refunds
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/refunds/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-manual-cases
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/manual-cases/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-transfer-drafts
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/transfer-drafts/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-confirmations
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/confirmations/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 30
                redis-rate-limiter.requestedTokens: 1
        # 信用运维任务由账户中心拥有，必须先于通配 ops 路由匹配
        - id: account-center-credit-ops
          uri: ${ACCOUNT_CENTER_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/ops/credit/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        # 监控运维路由：实时指标、告警处置、日报、数据质量、指标口径由业务中心提供；必须位于 credit-ops 之后。
        - id: business-center-ops
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/ops/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        # ========== 账户中心路由（仅已实现 Controller 的操作） ==========
        - id: account-center
          uri: ${ACCOUNT_CENTER_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/accounts/**,/api/v1/credit/**,/api/v1/bills/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1

        # ========== AI 服务路由 ==========
        - id: ai-service
          uri: ${AI_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/agent/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@agentKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

      # 全局默认过滤器
      default-filters:
        - RateLimitResponse
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

# ========== 阶段二受控鉴权（dev/test profile 显式启用） ==========
gateway:
  authentication:
    user-center-uri: ${USER_CENTER_URI:http://localhost:8081}
    service-token: ${INTERNAL_AUTH_SERVICE_TOKEN:local-internal-token}
    stub:
      enabled: ${GATEWAY_AUTH_STUB_ENABLED:true}
      token: ${GATEWAY_AUTH_STUB_TOKEN:any}
      principal-id: ${GATEWAY_AUTH_STUB_PRINCIPAL:dev-user-001}
      roles: ${GATEWAY_AUTH_STUB_ROLES:USER}
  cors:
    allowed-origins: ${GATEWAY_CORS_ORIGINS:http://localhost:8000,http://localhost:8001}
    max-age-seconds: ${GATEWAY_CORS_MAX_AGE:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.minialalipay.gateway: DEBUG
