server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: minialalipay-gateway
  data:
    redis:
      host: ${REDIS_HOST:39.107.95.141}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  cloud:
    gateway:
      routes:
        # ========== 用户中心路由 ==========
        - id: user-center-auth
          uri: ${USER_CENTER_URI:lb://user-center}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@loginKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
        - id: user-center-api
          uri: ${USER_CENTER_URI:lb://user-center}
          predicates:
            - Path=/api/v1/users/**,/api/v1/contacts/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 60
                redis-rate-limiter.burstCapacity: 120
                redis-rate-limiter.requestedTokens: 1
        # 支付密码校验使用更严格的用户维度限流
        - id: user-center-password
          uri: ${USER_CENTER_URI:lb://user-center}
          predicates:
            - Path=/api/v1/payment-password/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@paymentPasswordKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

        # ========== 业务中心路由 ==========
        - id: business-center-transfers
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/transfers/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 60
                redis-rate-limiter.burstCapacity: 120
                redis-rate-limiter.requestedTokens: 1
        # 二维码令牌交换使用独立限流
        - id: business-center-qrpay
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/qr-pay/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@qrTokenKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-p2p
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/p2p-collections/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@qrTokenKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-transactions
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 60
                redis-rate-limiter.burstCapacity: 120
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-monitoring
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/monitoring/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
        # ========== 以下为 P0 接口目录存在但此前缺失的业务中心路由 ==========
        - id: business-center-recharges
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/recharges/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 60
                redis-rate-limiter.burstCapacity: 120
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-transfer-drafts
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/transfer-drafts/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 60
                redis-rate-limiter.burstCapacity: 120
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-confirmations
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/confirmations/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-manual-cases
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/manual-cases/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
        # 信用运维任务由账户中心拥有，必须先于通配 ops 路由匹配
        - id: account-center-credit-ops
          uri: ${ACCOUNT_CENTER_URI:lb://account-center}
          predicates:
            - Path=/api/v1/ops/credit/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-ops
          uri: ${BUSINESS_CENTER_URI:lb://business-center}
          predicates:
            - Path=/api/v1/ops/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1

        # ========== 账户中心路由 ==========
        - id: account-center
          uri: ${ACCOUNT_CENTER_URI:lb://account-center}
          predicates:
            - Path=/api/v1/accounts/**,/api/v1/credit/**,/api/v1/bills/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 60
                redis-rate-limiter.burstCapacity: 120
                redis-rate-limiter.requestedTokens: 1

        # ========== AI 服务路由 ==========
        - id: ai-service
          uri: ${AI_SERVICE_URI:lb://ai-service}
          predicates:
            - Path=/api/v1/agent/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@agentKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1

      # 全局默认过滤器
      default-filters:
        - RateLimitResponse
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.minialalipay.gateway: DEBUG
