server:
  port: ${GATEWAY_PORT:8080}

spring:
  data:
    redis:
      host: ${REDIS_HOST:121.43.51.164}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:teamuser2026}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  cloud:
    gateway:
      routes:
        # ========== 鐢ㄦ埛涓績璺敱 ==========
        - id: user-center-auth
          uri: ${USER_CENTER_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@loginKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        - id: user-center-api
          uri: ${USER_CENTER_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**,/api/v1/contacts/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
        # 鏀粯瀵嗙爜鏍￠獙浣跨敤鏇翠弗鏍肩殑鐢ㄦ埛缁村害闄愭祦
        - id: user-center-password
          uri: ${USER_CENTER_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/payment-password/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@paymentPasswordKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1

        # ========== 涓氬姟涓績璺敱锛堜粎宸插疄鐜?Controller 鐨勬搷浣滐級 ==========
        - id: business-center-transfers
          uri: ${BUSINESS_CENTER_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/transfers/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
        # ---- 浠ヤ笅璺敱宸插垪鍏ュ绾︿絾瀵瑰簲 Controller 灏氭湭瀹炵幇锛屾殏绂佺敤 ----
        # 浜岀淮鐮侀潪璧勯噾鏉ユ簮璁㈠崟宸插疄鐜帮紱纭涓庢敮浠樹粛鐢变笟鍔′腑蹇冨彈鎺ц繑鍥炰緷璧栦笉鍙敤銆?
        - id: business-center-qr-pay
          uri: ${BUSINESS_CENTER_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/qr-pay/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 30
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-p2p-collections
          uri: ${BUSINESS_CENTER_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/p2p-collections/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 30
                redis-rate-limiter.requestedTokens: 1
        # transactions 鈫?鐜嬮挧骞?闃舵鍥涘凡瀹屾垚锛孋ontroller 寰呰ˉ鍏?
        - id: business-center-recharges
          uri: ${BUSINESS_CENTER_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/recharges/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-refunds
          uri: ${BUSINESS_CENTER_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/refunds/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-manual-cases
          uri: ${BUSINESS_CENTER_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/manual-cases/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-transfer-drafts
          uri: ${BUSINESS_CENTER_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/transfer-drafts/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
        - id: business-center-confirmations
          uri: ${BUSINESS_CENTER_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/confirmations/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 30
                redis-rate-limiter.requestedTokens: 1
        # 淇＄敤杩愮淮浠诲姟鐢辫处鎴蜂腑蹇冩嫢鏈夛紝蹇呴』鍏堜簬閫氶厤 ops 璺敱鍖归厤
        - id: account-center-credit-ops
          uri: ${ACCOUNT_CENTER_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/ops/credit/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
        # 鐩戞帶杩愮淮璺敱锛氬疄鏃舵寚鏍囥€佸憡璀﹀缃€佹棩鎶ャ€佹暟鎹川閲忋€佹寚鏍囧彛寰勭敱涓氬姟涓績鎻愪緵锛涘繀椤讳綅浜?credit-ops 涔嬪悗銆?
        - id: business-center-ops
          uri: ${BUSINESS_CENTER_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/ops/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        # ========== 璐︽埛涓績璺敱锛堜粎宸插疄鐜?Controller 鐨勬搷浣滐級 ==========
        - id: account-center
          uri: ${ACCOUNT_CENTER_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/accounts/**,/api/v1/credit/**,/api/v1/bills/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1

        # ========== AI 鏈嶅姟璺敱 ==========
        - id: ai-service
          uri: ${AI_SERVICE_URI:lb://ai-service}
          predicates:
            - Path=/api/v1/agent/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@agentKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

      # 鍏ㄥ眬榛樿杩囨护鍣?
      default-filters:
        - RateLimitResponse
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

# ========== 闃舵浜屽彈鎺ч壌鏉冿紙dev/test profile 鏄惧紡鍚敤锛?==========
gateway:
  authentication:
    user-center-uri: ${USER_CENTER_URI:http://localhost:8081}
    service-token: ${INTERNAL_AUTH_SERVICE_TOKEN:local-internal-token}
    stub:
      enabled: ${GATEWAY_AUTH_STUB_ENABLED:true}
      token: ${GATEWAY_AUTH_STUB_TOKEN:any}
      principal-id: ${GATEWAY_AUTH_STUB_PRINCIPAL:dev-user-001}
      roles: ${GATEWAY_AUTH_STUB_ROLES:USER}
  cors:
    allowed-origins: ${GATEWAY_CORS_ORIGINS:http://localhost:8000,http://localhost:8001}
    max-age-seconds: ${GATEWAY_CORS_MAX_AGE:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.minialalipay.gateway: DEBUG
