# 网关集成测试配置：关闭 Nacos，Redis 限流器由测试替身接管，启用受控鉴权 Stub
spring:
  cloud:
    nacos:
      discovery:
        enabled: false

gateway:
  authentication:
    stub:
      enabled: true
      token: test-token-for-integration
      principal-id: dev-user-001
      roles:
        - USER
        - OPERATOR
  cors:
    allowed-origins:
      - http://localhost:8000
      - http://localhost:8001
