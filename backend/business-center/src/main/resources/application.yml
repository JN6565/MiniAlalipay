server:
  port: ${BUSINESS_CENTER_PORT:8082}
spring:
  application:
    name: business-center
  datasource:
    url: ${BUSINESS_DB_URL:jdbc:mysql://121.43.51.164:3306/business_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${BUSINESS_DB_USERNAME:root}
    password: ${BUSINESS_DB_PASSWORD:teamuser2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 注意：Flyway 10 社区版不支持 ignore-migration-patterns（实测对 *:missing 无效）。
    # 远程库若出现本仓库缺失的已应用迁移（如队友分支先行应用），必须补充占位迁移文件
    # 并用 scripts/validate-flyway.ps1 -Repair 对齐校验和，禁止依赖该忽略配置。
    default-schema: ${BUSINESS_DB_SCHEMA:business_db}
    out-of-order: true
minialalipay:
  internal:
    account-center-url: ${ACCOUNT_CENTER_INTERNAL_URL:http://localhost:8083}
    user-center-url: ${USER_CENTER_INTERNAL_URL:http://localhost:8081}
    # 与 user-center 的 internal.auth.service-token / minialalipay.internal.service-token 保持一致，
    # 否则支付证明验证等内部调用会被拒绝并映射为 PAYMENT_PROOF_INVALID。
    service-token: ${INTERNAL_SERVICE_TOKEN:local-internal-token}
  tcc:
    # TCC 全局协调模式：seata 表示由 Seata TC 编排转账 TCC；http 回退为自研 HTTP 协调器。
    coordinator: ${TCC_COORDINATOR:seata}
  monitoring:
    enabled: ${MONITORING_ENABLED:true}
    health:
      gateway-url: ${GATEWAY_HEALTH_URL:http://localhost:8080/actuator/health}
      account-center-url: ${ACCOUNT_CENTER_HEALTH_URL:http://localhost:8083/actuator/health}
      ai-service-url: ${AI_SERVICE_HEALTH_URL:http://localhost:8084/actuator/health}
      timeout-ms: ${MONITORING_HEALTH_TIMEOUT_MS:800}
    outbox:
      fixed-delay-ms: ${MONITORING_OUTBOX_FIXED_DELAY_MS:1000}
      initial-delay-ms: ${MONITORING_OUTBOX_INITIAL_DELAY_MS:3000}
      batch-size: ${MONITORING_OUTBOX_BATCH_SIZE:100}
    consumer:
      fixed-delay-ms: ${MONITORING_CONSUMER_FIXED_DELAY_MS:1000}
      initial-delay-ms: ${MONITORING_CONSUMER_INITIAL_DELAY_MS:3000}
      batch-size: ${MONITORING_CONSUMER_BATCH_SIZE:100}
    alert:
      fixed-delay-ms: ${MONITORING_ALERT_FIXED_DELAY_MS:10000}
      initial-delay-ms: ${MONITORING_ALERT_INITIAL_DELAY_MS:5000}
      window-seconds: ${MONITORING_ALERT_WINDOW_SECONDS:60}
    report:
      cron: ${MONITORING_REPORT_CRON:0 0 1 * * *}
      zone: ${MONITORING_REPORT_ZONE:Asia/Shanghai}
    stream-key: ${MONITORING_STREAM_KEY:minialalipay:monitoring-events}
# Seata 分布式事务客户端（TM）：转账 TCC 全局事务发起方。
# TC 通过 Nacos SEATA_GROUP 分组的 seata-server 服务发现；配置中心使用本地 file（即本文件属性）。
seata:
  enabled: ${SEATA_ENABLED:true}
  application-id: ${spring.application.name}
  tx-service-group: ${SEATA_TX_SERVICE_GROUP:minialalipay-tx-group}
  # 资金链路只使用 TCC 模式，不需要 AT 模式的全局锁，禁止自动代理数据源以免影响 JDBC/Flyway。
  enable-auto-data-source-proxy: false
  registry:
    type: ${SEATA_REGISTRY_TYPE:nacos}
    nacos:
      application: ${SEATA_REGISTRY_APPLICATION:seata-server}
      server-addr: ${NACOS_SERVER_ADDR:121.43.51.164:8848}
      group: ${SEATA_REGISTRY_GROUP:SEATA_GROUP}
      cluster: ${SEATA_REGISTRY_CLUSTER:default}
      namespace: ${NACOS_NAMESPACE:}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  config:
    type: ${SEATA_CONFIG_TYPE:file}
  service:
    vgroup-mapping:
      minialalipay-tx-group: ${SEATA_CLUSTER:default}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    # 抑制 Flyway 幂等迁移中 SELECT 1 的冗余 INFO 日志
    org.flywaydb.core.internal.sqlscript: WARN
