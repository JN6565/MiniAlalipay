spring:
  datasource:
    url: jdbc:h2:mem:business_stage4;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  cloud:
    # 测试使用 localhost 直连 stub 地址，关闭负载均衡避免主机名被当作服务名解析
    loadbalancer:
      enabled: false
minialalipay:
  monitoring:
    enabled: false
  internal:
    account-center-url: http://localhost:18083
    user-center-url: http://localhost:18081
  recovery:
    fixed-delay-ms: 3600000
    initial-delay-ms: 3600000
    manual-review-fixed-delay-ms: 3600000
    manual-review-initial-delay-ms: 3600000
management:
  health:
    # 单元测试不连接 Redis，Redis 可用性不属于本测试的健康语义
    redis:
      enabled: false
# 单元测试不启动 Seata TM/RM，避免测试上下文连接远端 TC。
seata:
  enabled: false
