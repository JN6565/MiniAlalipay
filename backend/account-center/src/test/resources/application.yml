spring:
  datasource:
    url: jdbc:h2:mem:account_stage2;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  cloud:
    # 测试不依赖 Nacos 实例解析，关闭负载均衡保证服务名地址不被拦截
    loadbalancer:
      enabled: false
mybatis:
  configuration:
    map-underscore-to-camel-case: true
# 单元测试不启动 Seata RM，避免测试上下文连接远端 TC。
seata:
  enabled: false
