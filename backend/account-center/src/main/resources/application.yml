server:
  port: ${ACCOUNT_CENTER_PORT:8083}
spring:
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:mysql://121.43.51.164:3306/account_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${ACCOUNT_DB_USERNAME:root}
    password: ${ACCOUNT_DB_PASSWORD:teamuser2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: ${ACCOUNT_DB_SCHEMA:account_db}
  mybatis:
    mapper-locations: classpath:mapper/*.xml
    configuration:
      map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
minialalipay:
  internal:
    user-center-url: ${USER_CENTER_URL:http://localhost:8081}
    # 内部接口服务令牌，必须与 user-center 的同名配置一致
    service-token: ${INTERNAL_SERVICE_TOKEN:local-internal-token}
