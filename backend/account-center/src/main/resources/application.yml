server:
  port: ${ACCOUNT_CENTER_PORT:8083}
spring:
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:mysql://114.55.75.194:3306/account_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${ACCOUNT_DB_USERNAME:root}
    password: ${ACCOUNT_DB_PASSWORD:teamuser2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: ${ACCOUNT_DB_SCHEMA:account_db}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
minialalipay:
  internal:
    # 默认使用服务名，经 Nacos 负载均衡解析实例；直连地址可用 USER_CENTER_URL 覆盖
    user-center-url: ${USER_CENTER_URL:http://user-center}
    # 内部接口服务令牌，必须与 user-center 的同名配置一致
    service-token: ${INTERNAL_SERVICE_TOKEN:local-internal-token}
# Seata 分布式事务客户端（RM/TCC 参与者）：接收 TC 对转账分支的 Confirm/Cancel 回调。
# TC 通过 Nacos SEATA_GROUP 分组的 seata-server 服务发现；配置中心使用本地 file（即本文件属性）。
seata:
  enabled: ${SEATA_ENABLED:true}
  application-id: ${spring.application.name}
  tx-service-group: ${SEATA_TX_SERVICE_GROUP:minialalipay-tx-group}
  # 资金链路只使用 TCC 模式，不需要 AT 模式的全局锁，禁止自动代理数据源以免影响 MyBatis/Flyway。
  enable-auto-data-source-proxy: false
  registry:
    type: ${SEATA_REGISTRY_TYPE:nacos}
    nacos:
      application: ${SEATA_REGISTRY_APPLICATION:seata-server}
      server-addr: ${NACOS_SERVER_ADDR:114.55.75.194:8848}
      group: ${SEATA_REGISTRY_GROUP:SEATA_GROUP}
      cluster: ${SEATA_REGISTRY_CLUSTER:default}
      namespace: ${NACOS_NAMESPACE:}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  config:
    type: ${SEATA_CONFIG_TYPE:file}
  service:
    vgroup-mapping:
      minialalipay-tx-group: ${SEATA_CLUSTER:default}
