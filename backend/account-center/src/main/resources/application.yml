server:
  port: ${ACCOUNT_CENTER_PORT:8083}
spring:
  application:
    name: account-center
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:mysql://localhost:3306/account_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4}
    username: ${ACCOUNT_DB_USERNAME:minialalipay}
    password: ${ACCOUNT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: ${ACCOUNT_DB_SCHEMA:account_db}
  mybatis:
    mapper-locations: classpath:mapper/*.xml
    configuration:
      map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
