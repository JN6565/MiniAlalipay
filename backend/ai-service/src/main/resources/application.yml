server:
  port: ${AI_SERVICE_PORT:8084}

spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  datasource:
    url: ${AGENT_DB_URL:jdbc:mysql://121.43.51.164:3306/agent_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${AGENT_DB_USERNAME:root}
    password: ${AGENT_DB_PASSWORD:teamuser2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 300000
      keepalive-time: 60000
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: ${AGENT_DB_SCHEMA:agent_db}
  data:
    redis:
      host: ${REDIS_HOST:121.43.51.164}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:teamuser2026}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  ai:
    openai:
      # 真实 Key 以 sk- 开头，设置 SPRING_AI_OPENAI_API_KEY 环境变量覆盖；未设置时使用 Mock 模式
      api-key: ${SPRING_AI_OPENAI_API_KEY:sk-0fbdcf2e0ae44affa6a4515f71680d8a}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_MODEL:deepseek-chat}
          temperature: 0.1

mybatis:
  configuration:
    map-underscore-to-camel-case: true

ai:
  prompt:
    system: |
      你是一只傲娇猫娘，名叫吱托芙，现在作为aialipay助手，你的职责是帮助用户完成转账、查余额、查交易、
      查花呗和还花呗等操作。你必须遵守以下规则：
      1. 不臆造金额、账户或交易状态
      2. 缺失必填槽位时必须生成澄清问题，不臆造默认值
      3. 意图置信度不足时展示支持范围，不执行写工具
      4. 支付密码、确认令牌和访问令牌不出现在任何回复或摘要中
      5. 收款人必须来自受控查询工具返回值
    output-format: |
      ---
      你必须使用以下 JSON 格式回复，不要包含任何 JSON 之外的内容：
      {
        "intent": "TRANSFER|BALANCE_QUERY|TRANSACTION_LIST|TRANSACTION_STATUS|USER_SEARCH|CREDIT_SUMMARY|CREDIT_BILL|CREDIT_REPAYMENT|UNKNOWN",
        "slots": {"槽位名": "槽位值"},
        "missingFields": ["缺失的必填字段"],
        "confidence": 0.0到1.0之间的数值,
        "clarificationNeeded": true或false,
        "naturalReply": "面向用户展示的自然语言回复"
      }
      规则：
      - intent 必须是枚举值之一，无法确定时用 UNKNOWN
      - 缺失必填字段时 clarificationNeeded=true，missingFields 列出字段名
      - amountFen 必须是整数（分），例如 10000 表示 100.00 元
      - payeeId 留 null，由工具查询后填入
      - 转账时必须将用户提到的收款人名称/手机号提取到 query 槽位，供搜索工具使用
      - naturalReply 是给用户看的自然语言回复
      - 不要编造任何金额、账户或交易状态
  streaming:
    chunk-size: 2
    chunk-delay-ms: 120
    thinking-delay-ms: 800
  llm:
    mock-mode: ${AI_LLM_MOCK_MODE:true}
    connect-timeout: 2s
    read-timeout: 8s
    max-concurrent: 20
    circuit-breaker:
      failure-threshold: 3
      open-state-duration: 30s
  client:
    mock-mode: ${AI_CLIENT_MOCK_MODE:false}
    timeout-ms: 3000
    # AI 服务通过网关(localhost:8080)调用下游，由网关完成鉴权、限流和审计。
    user-center:
      base-url: ${USER_CENTER_URI:http://localhost:8080}
    business-center:
      base-url: ${BUSINESS_CENTER_URI:http://localhost:8080}
    account-center:
      base-url: ${ACCOUNT_CENTER_URI:http://localhost:8080}
  mcp:
    tool-timeout: 3s
    max-retries: 1
  session:
    timeout: 30m
    max-concurrent-sessions: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.minialalipay.ai: DEBUG
