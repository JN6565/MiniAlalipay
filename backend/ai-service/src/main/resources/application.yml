server:
  port: ${AI_SERVICE_PORT:8084}

spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  datasource:
    url: ${AGENT_DB_URL:jdbc:mysql://121.43.51.164:3306/agent_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${AGENT_DB_USERNAME:root}
    password: ${AGENT_DB_PASSWORD:teamuser2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: ${AGENT_DB_SCHEMA:agent_db}
  data:
    redis:
      host: ${REDIS_HOST:121.43.51.164}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:teamuser2026}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  ai:
    openai:
      # 真实 Key 以 sk- 开头，设置 SPRING_AI_OPENAI_API_KEY 环境变量覆盖；未设置时使用 Mock 模式
      api-key: ${SPRING_AI_OPENAI_API_KEY:sk-0fbdcf2e0ae44affa6a4515f71680d8a}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_MODEL:deepseek-chat}
          temperature: 0.1

mybatis:
  configuration:
    map-underscore-to-camel-case: true

ai:
  llm:
    mock-mode: ${AI_LLM_MOCK_MODE:true}
    connect-timeout: 2s
    read-timeout: 8s
    max-concurrent: 20
    circuit-breaker:
      failure-threshold: 3
      open-state-duration: 30s
  client:
    mock-mode: ${AI_CLIENT_MOCK_MODE:false}
    timeout-ms: 3000
    # AI 服务通过网关(localhost:8080)调用下游，由网关完成鉴权、限流和审计。
    user-center:
      base-url: ${USER_CENTER_URI:http://localhost:8080}
    business-center:
      base-url: ${BUSINESS_CENTER_URI:http://localhost:8080}
    account-center:
      base-url: ${ACCOUNT_CENTER_URI:http://localhost:8080}
  stream:
    thread-pool-size: ${AI_STREAM_THREAD_POOL:4}
  mcp:
    tool-timeout: 3s
    max-retries: 1
  session:
    timeout: 30m
    max-concurrent-sessions: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.minialalipay.ai: DEBUG
