spring:
  datasource:
    url: jdbc:h2:mem:agent_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS AGENT_DB
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/test-schema.sql
  cloud:
    # 测试不依赖 Nacos 实例解析，关闭负载均衡保证服务名地址不被拦截
    loadbalancer:
      enabled: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
