# Nacos 服务发现与配置引导
spring:
  application:
    name: user-center
  cloud:
    nacos:
      discovery:
        # 网关注册到 Nacos，便于运维观测与未来 lb:// 路由；如 Nacos 的 gRPC 端口(9848)不可达
        # 导致启动失败，可通过 NACOS_REGISTER_ENABLED=false 临时关闭注册。
        server-addr: ${NACOS_SERVER_ADDR:121.43.51.164:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP

