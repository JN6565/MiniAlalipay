server:
  port: ${USER_CENTER_PORT:8081}
spring:
  application:
    name: user-center
  data:
    redis:
      host: ${REDIS_HOST:121.43.51.164}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:teamuser2026}
      timeout: 2000ms
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://121.43.51.164:3306/user_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${USER_DB_USERNAME:root}
    password: ${USER_DB_PASSWORD:teamuser2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: user_db
# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
# 账户中心配置：默认使用服务名，经 Nacos 负载均衡解析实例；直连地址可用 ACCOUNT_CENTER_URL 覆盖
account-center:
  url: ${ACCOUNT_CENTER_URL:http://account-center}
internal:
  auth:
    # 内部接口服务令牌，必须与 business-center/account-center 的同名配置一致
    service-token: ${INTERNAL_SERVICE_TOKEN:local-internal-token}
management:
  endpoints:
    web:
      exposure:
        include: health,info
